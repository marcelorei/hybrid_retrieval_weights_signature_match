[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marcelorei-hybrid_retrieval_weights_signature_match"
version = "0.1.0"
description = "通过字符级与结构级特征识别自动驾驶感知工程师·混合检索的权重调节的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "marcelorei" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://marcelorei.github.io"
Repository = "https://github.com/marcelorei/hybrid_retrieval_weights_signature_match"
Issues = "https://github.com/marcelorei/hybrid_retrieval_weights_signature_match/issues"

[project.scripts]
hybrid_retrieval_weights_signature_match = "hybrid_retrieval_weights_signature_match:main"

[tool.setuptools]
py-modules = ["hybrid_retrieval_weights_signature_match"]
